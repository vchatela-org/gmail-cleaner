name: Build and Push Docker Image to GHCR

# Fork-only workflow: publishes this fork's build to GHCR on a GitHub-hosted
# runner. Must never be included in pull requests sent upstream.
#
# The image the cluster pulls, built where a public repository may: a hosted
# runner, which is free for public repositories and carries no cluster identity.
# The old path pushed to Harbor, an internal host reachable only from the
# organisation's self-hosted runners — which no longer accept public repositories.

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

# Least privilege by default; the job grants what it needs.
permissions:
  contents: read

jobs:
  docker-build-push:
    # Only here: a fork has neither the token nor the package.
    if: github.repository == 'vchatela-org/gmail-cleaner'
    permissions:
      contents: read
      packages: write
    uses: vchatela-org/shared-workflows/.github/workflows/docker-build-push-ghcr.yml@5edb0a3d635f66307f3b86cc4d926c253ef40ed2 # v1.3.1
    with:
      image_name: gmail-cleaner

  github-release:
    name: 📝 GitHub Release
    # The notes Renovate puts in the homelab's bump PR: it finds this repository from the
    # image's org.opencontainers.image.source label, then shows the GitHub Release of every
    # version the bump brings. Nothing else publishes one for a tag here, so this does --
    # once the image is out -- listing the PRs merged since the previous tag.
    needs: docker-build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release, with the PRs merged since the previous tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a release: left as it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The previous tag in version order. GitHub's own default is the latest release,
          # and tags here had none: the notes would list every PR since the first commit.
          previous=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --paginate \
            --jq '.[].ref | ltrimstr("refs/tags/")' | { cat; echo "$TAG"; } | sort -uV \
            | grep -x -B1 -F -- "$TAG" | head -n1)
          args=(--verify-tag --generate-notes --title "$TAG")
          since="the first commit"
          if [ "$previous" != "$TAG" ]; then
            args+=(--notes-start-tag "$previous")
            since=$previous
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          echo "Published $TAG, with the PRs merged since $since." >> "$GITHUB_STEP_SUMMARY"
