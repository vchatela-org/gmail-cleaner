version: 2
updates:
  # Python dependencies: pyproject.toml + uv.lock. Nothing else updates this
  # repository's dependencies; Renovate only manages the homelab-gitops image pins.
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"

  # Base images in the Dockerfile (python:3.13-alpine, the uv builder image).
  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 2
    schedule:
      interval: "weekly"
